name: Build Misbaha APK

on:
  push:
    paths:
      - 'misbaha/**'
      - '.github/workflows/misbaha-build.yml'
  pull_request:
    paths:
      - 'misbaha/**'
      - '.github/workflows/misbaha-build.yml'
  workflow_dispatch:

concurrency:
  group: misbaha-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK + upload artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android packages (SDK is preinstalled on the runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd misbaha
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug > /tmp/gradle-build.log 2>&1
          status=$?
          set -e
          echo "----- gradle exit code: $status -----"
          tail -n 60 /tmp/gradle-build.log
          if [ $status -ne 0 ]; then
            cp /tmp/gradle-build.log "$GITHUB_WORKSPACE/misbaha/CI_FAILURE_LOG.txt"
            git -C "$GITHUB_WORKSPACE" config user.name "ci-logger"
            git -C "$GITHUB_WORKSPACE" config user.email "ci-logger@users.noreply.github.com"
            git -C "$GITHUB_WORKSPACE" add misbaha/CI_FAILURE_LOG.txt
            git -C "$GITHUB_WORKSPACE" commit -m "ci: capture gradle build failure log"
            git -C "$GITHUB_WORKSPACE" push origin HEAD:refs/notes/ci-failure-apk --force
          fi
          exit $status

      - name: Verify APK content (package + fixed bottom bar string)
        run: |
          APK=misbaha/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | head -n 1)"
          echo "AAPT2=$AAPT2"
          "$AAPT2" dump badging "$APK" | grep -F 'com.abognaf.misbaha' | head -n 1
          "$AAPT2" dump resources "$APK" | grep -F 'أبوقناف للأتمتة • 777808020'
          echo "OK: APK contains the correct package and the fixed bottom bar string."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Misbaha-APK
          path: misbaha/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling release with direct APK download link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp misbaha/app/build/outputs/apk/debug/app-debug.apk Misbaha-debug.apk
          gh release delete misbaha-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create misbaha-latest Misbaha-debug.apk \
            --title "المسبحة الإلكترونية — APK للتثبيت المباشر" \
            --notes "نسخة debug تُحدَّث تلقائيًا مع كل بناء ناجح (آخر تحديث: $(date -u +%Y-%m-%d)).
            رابط تثبيت ثابت:
            https://github.com/gnaf157-eng/alameer-station/releases/download/misbaha-latest/Misbaha-debug.apk"

  tests:
    name: Unit tests (Robolectric)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android packages (SDK is preinstalled on the runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Robolectric unit tests
        run: |
          cd misbaha
          set +e
          gradle --no-daemon --stacktrace :app:testDebugUnitTest > /tmp/gradle-test.log 2>&1
          status=$?
          set -e
          echo "----- gradle exit code: $status -----"
          tail -n 60 /tmp/gradle-test.log
          if [ $status -ne 0 ]; then
            cp /tmp/gradle-test.log "$GITHUB_WORKSPACE/misbaha/CI_FAILURE_LOG.txt"
            git -C "$GITHUB_WORKSPACE" config user.name "ci-logger"
            git -C "$GITHUB_WORKSPACE" config user.email "ci-logger@users.noreply.github.com"
            git -C "$GITHUB_WORKSPACE" add misbaha/CI_FAILURE_LOG.txt
            git -C "$GITHUB_WORKSPACE" commit -m "ci: capture gradle test failure log"
            git -C "$GITHUB_WORKSPACE" push origin HEAD:refs/notes/ci-failure --force
          fi
          exit $status

  screenshots:
    name: Emulator visual check (bottom bar proof)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: apk
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages + emulator + system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-34;google_apis;x86_64"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd misbaha
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug > /tmp/gradle-build.log 2>&1
          status=$?
          set -e
          echo "----- gradle exit code: $status -----"
          tail -n 60 /tmp/gradle-build.log
          if [ $status -ne 0 ]; then
            cp /tmp/gradle-build.log "$GITHUB_WORKSPACE/misbaha/CI_FAILURE_LOG.txt"
            git -C "$GITHUB_WORKSPACE" config user.name "ci-logger"
            git -C "$GITHUB_WORKSPACE" config user.email "ci-logger@users.noreply.github.com"
            git -C "$GITHUB_WORKSPACE" add misbaha/CI_FAILURE_LOG.txt
            git -C "$GITHUB_WORKSPACE" commit -m "ci: capture gradle build failure log"
            git -C "$GITHUB_WORKSPACE" push origin HEAD:refs/notes/ci-failure-shots --force
          fi
          exit $status

      - name: Run app on emulator and capture screenshots
        run: |
          cat > /tmp/emu-script.sh <<'SCRIPT'
          set -uo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          # توحيد مكان AVDs بين avdmanager والإيموليتور
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          fail() {
            echo "ERROR: $1"
            echo "----- emulator boot log (tail) -----"
            tail -n 120 /tmp/emulator-boot.log 2>/dev/null || true
            echo "----- adb devices -----"
            timeout 15 adb devices 2>/dev/null || true
            exit 1
          }

          echo "ANDROID_HOME=$ANDROID_HOME"
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          [ -e /dev/kvm ] || fail "/dev/kvm is not available on this runner (KVM is required)"
          echo "KVM available"

          AVD_NAME=misbaha
          if ! avdmanager list avd 2>/dev/null | grep -q "Avd name: ${AVD_NAME}$"; then
            echo "Creating AVD..."
            echo no | avdmanager create avd -n "$AVD_NAME" -k "system-images;android-34;google_apis;x86_64"
          fi
          avdmanager list avd

          "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -camera-back none -camera-front none -skin 1080x2340 \
            > /tmp/emulator-boot.log 2>&1 &
          EMU_PID=$!
          echo "Emulator process started (pid $EMU_PID)"

          timeout 240 adb wait-for-device || fail "adb wait-for-device timed out after 4 minutes"
          echo "Device seen by adb"

          boot=""
          for i in $(seq 1 100); do
            if ! kill -0 $EMU_PID 2>/dev/null; then
              fail "emulator process died during boot"
            fi
            boot=$(timeout 15 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ $(( i % 5 )) -eq 0 ]; then
              echo "boot wait: attempt $i, boot_completed=$boot"
            fi
            [ "$boot" = "1" ] && break
            sleep 4
          done
          [ "$boot" = "1" ] || fail "emulator did not finish booting within ~8 minutes"
          echo "Emulator booted"

          # تعطيل الرسوم المتحركة حتى تستقر النوافذ ويستطيع uiautomator التقاط التسلسل
          timeout 30 adb shell settings put global window_animation_scale 0
          timeout 30 adb shell settings put global transition_animation_scale 0
          timeout 30 adb shell settings put global animator_duration_scale 0
          sleep 2

          cd misbaha
          timeout 180 adb install -r app/build/outputs/apk/debug/app-debug.apk || fail "adb install failed"
          echo "APK installed"
          timeout 30 adb logcat -c 2>/dev/null || true
          timeout 60 adb shell am start -n com.abognaf.misbaha/.MisbahaActivity || fail "am start failed"
          # انتظار حتى تظهر نافذة التطبيق في المقدمة (حتى 60 ثانية)
          app_focus=""
          for i in $(seq 1 60); do
            app_focus=$(timeout 15 adb shell dumpsys window 2>/dev/null | grep -m1 'mCurrentFocus' | tr -d '\r' || true)
            case "$app_focus" in *com.abognaf.misbaha*) break;; esac
            sleep 1
          done
          case "$app_focus" in
            *com.abognaf.misbaha*) echo "app is in the foreground";;
            *) echo "WARNING: app not in foreground after 60s (focus=$app_focus)";;
          esac
          sleep 3
          mkdir -p screenshots
          timeout 120 adb exec-out screencap -p > screenshots/1-home.png || fail "screencap 1 failed"
          echo "screenshot 1 (home) captured"

          # يضغط على العنصر صاحب الـ resource-id المحدد (الزر الدائري أو الشريط السفلي)
          tap_id() {
            local bounds="" attempt
            for attempt in 1 2 3; do
              timeout 60 adb shell uiautomator dump /sdcard/ui.xml > /dev/null
              timeout 60 adb pull /sdcard/ui.xml /tmp/ui.xml > /dev/null
              # توحيد علامات الاقتباس ثم البحث (يعمل مع أي صيغة إخراج)
              tr '"' "'" < /tmp/ui.xml > /tmp/ui_norm.xml
              bounds=$(grep -o "resource-id='com.abognaf.misbaha:id/$1'[^>]*bounds='[^']*'" /tmp/ui_norm.xml | head -n 1 | grep -o "bounds='[^']*'" | cut -d"'" -f2)
              [ -n "$bounds" ] && break
              echo "dump attempt $attempt: element $1 not found, retrying..."
              sleep 3
            done
            [ -n "$bounds" ] || {
              echo "ERROR: element $1 not found in uiautomator dump"
              echo "--- window focus:"
              timeout 15 adb shell dumpsys window 2>/dev/null | grep -m2 -E 'mCurrentFocus|mFocusedApp' | tr -d '\r' || true
              echo "--- resource-ids present in dump (any quoting):"
              tr '"' "'" < /tmp/ui.xml | grep -o "resource-id='[^']*'" | sort -u | head -n 30 || true
              echo "--- raw head of ui.xml (first 900 bytes):"
              head -c 900 /tmp/ui.xml || true
              echo
              echo "--- crash log:"
              timeout 30 adb logcat -d -b crash -t 100 2>/dev/null || true
              exit 1
            }
            local x1 y1 x2 y2
            x1=$(echo "$bounds" | cut -d'[' -f2 | cut -d',' -f1)
            y1=$(echo "$bounds" | cut -d'[' -f2 | cut -d',' -f2 | tr -d ']')
            x2=$(echo "$bounds" | cut -d'[' -f3 | cut -d',' -f1)
            y2=$(echo "$bounds" | cut -d'[' -f3 | cut -d',' -f2 | tr -d ']')
            timeout 30 adb shell input tap $(( (x1 + x2) / 2 )) $(( (y1 + y2) / 2 ))
          }

          # 5 ضغطات على الزر الدائري: يجب أن يظهر العدد 5 ويطر الذكر
          for i in 1 2 3 4 5; do
            tap_id tasbih_button || fail "tap on tasbih button failed"
            sleep 0.5
          done
          sleep 1
          timeout 120 adb exec-out screencap -p > screenshots/2-count5.png || fail "screencap 2 failed"
          echo "screenshot 2 (count=5) captured"

          # الضغط على الشريط السفلي يفتح نافذة "حول التطبيق"
          tap_id developer_bar || fail "tap on developer bar failed"
          sleep 2
          timeout 120 adb exec-out screencap -p > screenshots/3-about-dialog.png || fail "screencap 3 failed"
          echo "screenshot 3 (about dialog) captured"

          kill $EMU_PID 2>/dev/null || true
          echo "Screenshots captured:"
          ls -la screenshots
          SCRIPT
          set +e
          bash /tmp/emu-script.sh > /tmp/emu-job.log 2>&1
          status=$?
          set -e
          echo "----- emulator job exit code: $status -----"
          tail -n 100 /tmp/emu-job.log
          if [ $status -ne 0 ]; then
            cp /tmp/emu-job.log "$GITHUB_WORKSPACE/misbaha/CI_FAILURE_LOG.txt"
            git -C "$GITHUB_WORKSPACE" config user.name "ci-logger"
            git -C "$GITHUB_WORKSPACE" config user.email "ci-logger@users.noreply.github.com"
            git -C "$GITHUB_WORKSPACE" add misbaha/CI_FAILURE_LOG.txt
            git -C "$GITHUB_WORKSPACE" commit -m "ci: capture emulator job failure log"
            git -C "$GITHUB_WORKSPACE" push origin HEAD:refs/notes/ci-failure-shots --force
          fi
          exit $status

      - name: Push screenshots to refs/notes (for inspection)
        run: |
          git -C "$GITHUB_WORKSPACE" config user.name "ci-screenshots"
          git -C "$GITHUB_WORKSPACE" config user.email "ci-screenshots@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add misbaha/screenshots/
          git -C "$GITHUB_WORKSPACE" commit -m "ci: emulator screenshots"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:refs/notes/ci-screenshots --force

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: Misbaha-Screenshots
          path: misbaha/screenshots/*.png
          if-no-files-found: error
          retention-days: 30
