name: Build installable APK

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    concurrency:
      group: station-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install required Android packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          set +e
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # أخطاء الترجمة أولًا، ثم أي سبب فشل آخر (اختبارات، مهام جريدل).
            grep -E "^(e: |.*\.java:[0-9]+: error:)" /tmp/build.log | head -20 | while read -r line; do
              echo "::error::$line"
            done
            grep -E "(FAILED|What went wrong|Execution failed|Caused by:|Test.*FAILED|> [A-Za-z].*Exception)" /tmp/build.log \
              | grep -v "^::" | head -25 | while read -r line; do
              echo "::error::$line"
            done
            tail -40 /tmp/build.log | while read -r line; do echo "::notice::$line"; done
          fi
          exit $code

      - name: Summarize accounting tests
        if: always()
        run: |
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals: totals[key] += int(root.get(key, 0))
              for failure in root.iter('failure'):
                  print('TEST_FAILURE', path, (failure.text or '')[:5000])
          print('TEST_SUMMARY', totals)
          PYTEST

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/ui/
            app/build/reports/pdf/

      - name: Read app version
        id: version
        run: |
          echo "name=$(grep -oP "versionName '\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -oP 'versionCode \K\d+' app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: github.ref == 'refs/heads/arena/01a07882-alameer-station' || github.ref == 'refs/heads/arena/accounting-audit-264' || github.ref == 'refs/heads/arena/cat-ledgers-workflow'
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Configure KEYSTORE_BASE64 with the existing production signing key before releasing. Do not generate a replacement key."
            exit 1
          fi

      - name: Build signed release APK
        if: github.ref == 'refs/heads/arena/01a07882-alameer-station' || github.ref == 'refs/heads/arena/accounting-audit-264' || github.ref == 'refs/heads/arena/cat-ledgers-workflow'
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          UPDATE_MANIFEST_URL: ${{ secrets.UPDATE_MANIFEST_URL }}
        run: |
          for required in KEYSTORE_FILE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!required}" ]; then echo "::error::Missing release signing secret: $required"; exit 1; fi
          done
          # التطبيق يقرأ التحديث من المستودع العام للنسخ إن ضُبط.
          if [ -n "$UPDATE_MANIFEST_URL" ]; then
            export UPDATE_MANIFEST_URL
          elif [ -n "$RELEASES_REPO" ]; then
            export UPDATE_MANIFEST_URL="https://github.com/$RELEASES_REPO/releases/latest/download/update-manifest.json"
          fi
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk \
             "Tabiq-v${{ steps.version.outputs.name }}.apk"

      - name: Verify the APK is signed
        if: github.ref == 'refs/heads/arena/01a07882-alameer-station' || github.ref == 'refs/heads/arena/accounting-audit-264' || github.ref == 'refs/heads/arena/cat-ledgers-workflow'
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "Tabiq-v${{ steps.version.outputs.name }}.apk" | tee certs.txt
          grep -q "SHA-256 digest" certs.txt


      - name: Verify candidate update compatibility
        if: github.ref == 'refs/heads/arena/accounting-audit-264' || github.ref == 'refs/heads/arena/cat-ledgers-workflow'
        env:
          CANDIDATE_VERSION_NAME: ${{ steps.version.outputs.name }}
          CANDIDATE_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 \
            'https://github.com/gnaf157-eng/alameer-station/releases/download/v2.66.1/Tabiq-v2.66.1.apk' \
            --output "$RUNNER_TEMP/Tabiq-v2.66.1-reference.apk"
          python3 - <<'PYCHECK'
          import hashlib, json, os, pathlib, re, subprocess

          build_tools = pathlib.Path(os.environ['ANDROID_SDK_ROOT']) / 'build-tools' / '35.0.0'
          previous = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Tabiq-v2.66.1-reference.apk'
          candidate = pathlib.Path('Tabiq-v' + os.environ['CANDIDATE_VERSION_NAME'] + '.apk')
          expected_hash = '4d096dfd64312ea2ad6d8faecae39e087ed12a902b89a194256497108d6cf17e'

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          if digest(previous) != expected_hash:
              raise RuntimeError('The reference APK does not match the published 2.66.1 SHA-256.')

          def inspect(path):
              certificates = subprocess.check_output(
                  [str(build_tools / 'apksigner'), 'verify', '--print-certs', str(path)],
                  text=True)
              fingerprints = sorted(set(re.findall(
                  r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)$',
                  certificates, re.MULTILINE)))
              if not fingerprints:
                  raise RuntimeError('No verified signing certificate in ' + path.name)
              # Verify signatures for the Android 9/10 devices used for this application.
              subprocess.run(
                  [str(build_tools / 'apksigner'), 'verify', '--min-sdk-version', '28',
                   '--max-sdk-version', '29', str(path)], check=True)
              badging = subprocess.check_output(
                  [str(build_tools / 'aapt'), 'dump', 'badging', str(path)], text=True)
              package = re.search(
                  r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'",
                  badging, re.MULTILINE)
              if package is None:
                  raise RuntimeError('Cannot read APK identity for ' + path.name)
              return dict(package=package[1], versionCode=int(package[2]),
                          versionName=package[3], signerSha256=fingerprints, sha256=digest(path))

          old, new = inspect(previous), inspect(candidate)
          if old['package'] != 'com.alameer.station.shifts.v2' or new['package'] != old['package']:
              raise RuntimeError('The application ID differs from the installed-release family.')
          if old['versionName'] != '2.66.1' or old['versionCode'] != 153:
              raise RuntimeError('The reference APK version is not 2.66.1 (153).')
          if new['signerSha256'] != old['signerSha256']:
              raise RuntimeError('Signing certificate mismatch: do not install or release this APK.')
          if new['versionCode'] != int(os.environ['CANDIDATE_VERSION_CODE']) or new['versionCode'] <= old['versionCode']:
              raise RuntimeError('The candidate version code must match the source and exceed the reference.')
          if new['versionName'] != os.environ['CANDIDATE_VERSION_NAME']:
              raise RuntimeError('The candidate version name does not match the source.')

          report = dict(commit=os.environ['GITHUB_SHA'], reference=old, candidate=new,
                        signatureAndPackageCheck='passed', phoneUpgradeTest='pending',
                        liveUserDataAccessed=False)
          pathlib.Path('upgrade-verification.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Candidate upgrade verification\n\n')
              summary.write('Same signing certificate and application ID as 2.66.1 (153); '
                            'candidate version code is higher. Signatures verified for Android 9/10.\n\n')
              summary.write('Phone installation, data retention and visual checks are still pending. '
                            'Release publication is handled by the later publish step.\n')
          PYCHECK

      - name: Upload verified candidate for phone testing
        if: github.ref == 'refs/heads/arena/accounting-audit-264' || github.ref == 'refs/heads/arena/cat-ledgers-workflow'
        uses: actions/upload-artifact@v4
        with:
          name: Tabiq-candidate-${{ steps.version.outputs.name }}
          path: |
            Tabiq-v${{ steps.version.outputs.name }}.apk
            upgrade-verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Generate update manifest
        if: github.ref == 'refs/heads/arena/01a07882-alameer-station' || github.ref == 'refs/heads/arena/cat-ledgers-workflow'
        run: |
          FILE="Tabiq-v${{ steps.version.outputs.name }}.apk"
          SIZE=$(stat -c%s "$FILE")
          HASH=$(sha256sum "$FILE" | cut -d" " -f1)
          HOST_REPO="${{ vars.RELEASES_REPO }}"
          if [ -z "$HOST_REPO" ]; then HOST_REPO="${{ github.repository }}"; fi
          BASE="https://github.com/$HOST_REPO/releases/download/v${{ steps.version.outputs.name }}"
          cat > update-manifest.json <<JSON
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ steps.version.outputs.name }}",
            "apkUrl": "$BASE/$FILE",
            "sizeBytes": $SIZE,
            "sha256": "$HASH",
            "notes": "نسخة ${{ steps.version.outputs.name }} من تطبيق طابق ورحّل.",
            "required": false
          }
          JSON
          cat update-manifest.json

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/arena/01a07882-alameer-station' || github.ref == 'refs/heads/arena/cat-ledgers-workflow'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          APK="Tabiq-v${{ steps.version.outputs.name }}.apk"

          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          طباعة كشف حركة لحساب محدد من الدفاتر الرسمية: عميل أو سائق، صندوق بعملته، مادة، شركة أو بند مصروف.
          اختيار الفترة من تاريخ إلى تاريخ، مع رصيد بداية الفترة وجميع الحركات وإجمالياتها والرصيد النهائي، دون حد 500 حركة.
          مشاركة PDF أو فتح طباعة Android، مع ترقيم الصفحات والأرصدة المنقولة وإظهار البيانات الطويلة كاملة.
          الكشف يقرأ الحركات المعتمدة، ويستبعد حركات الشركة الملغاة ويحافظ على فصل العملات ودقة أسعار الصرف المحفوظة.
          تحديث موقّع للتطبيق الأصلي. يثبت فوق النسخة السابقة دون حذف التطبيق.
          NOTES

          publish_repo() {
            local destination="$1"
            if gh release view "$TAG" --repo "$destination" >/dev/null 2>&1; then
              echo "::error::Version $TAG already exists in $destination. Published versions are immutable; use a new version."
              return 1
            fi
            local target_args=()
            if [ "$destination" = "$GITHUB_REPOSITORY" ]; then
              target_args=(--target "$GITHUB_SHA")
            fi
            # Upload both assets while hidden, then expose the complete release atomically.
            gh release create "$TAG" --repo "$destination" "${target_args[@]}" \
              --draft --title "طابق ورحّل ${{ steps.version.outputs.name }}" \
              --notes-file release-notes.md "$APK" update-manifest.json
            gh release edit "$TAG" --repo "$destination" --draft=false --latest
          }

          if [ -n "$RELEASES_REPO" ] && [ "$RELEASES_REPO" != "$GITHUB_REPOSITORY" ]; then
            if [ -z "$RELEASES_TOKEN" ]; then
              echo "::error::RELEASES_TOKEN is required for the configured public update repository."
              exit 1
            fi
            GH_TOKEN="$RELEASES_TOKEN" publish_repo "$RELEASES_REPO"
          fi
          publish_repo "$GITHUB_REPOSITORY"

      - name: Verify public in-app update
        if: github.ref == 'refs/heads/arena/01a07882-alameer-station' || github.ref == 'refs/heads/arena/cat-ledgers-workflow'
        env:
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
        run: |
          python3 - <<'PYLIVE'
          import hashlib, json, os, pathlib, time, urllib.request
          expected = json.loads(pathlib.Path('update-manifest.json').read_text())
          repo = os.environ.get('RELEASES_REPO') or os.environ['GITHUB_REPOSITORY']
          feed = 'https://github.com/' + repo + '/releases/latest/download/update-manifest.json'
          request = urllib.request.Request(feed + '?t=' + str(int(time.time() * 1000)), headers={'User-Agent': 'TabiqUpdater', 'Cache-Control': 'no-cache'})
          with urllib.request.urlopen(request, timeout=30) as response:
              actual = json.loads(response.read(65536))
          if actual != expected:
              raise RuntimeError('The public update feed does not match the verified release.')
          with urllib.request.urlopen(actual['apkUrl'], timeout=30) as response:
              apk = response.read(100 * 1024 * 1024)
          if len(apk) != actual['sizeBytes'] or hashlib.sha256(apk).hexdigest() != actual['sha256']:
              raise RuntimeError('Public APK download failed its size or SHA-256 check.')
          print('PUBLIC_UPDATE_VERIFIED', actual['versionName'], actual['versionCode'], feed)
          PYLIVE

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload installable APK
        if: github.ref == 'refs/heads/arena/01a07882-alameer-station' || github.ref == 'refs/heads/arena/cat-ledgers-workflow'
        uses: actions/upload-artifact@v4
        with:
          name: Alameer-Station-Shifts-APK
          path: |
            Tabiq-v*.apk
            update-manifest.json
          if-no-files-found: error
          retention-days: 30


      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 30

