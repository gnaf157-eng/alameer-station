name: Build installable APK

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install required Android packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          set +e
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # أخطاء الترجمة أولًا، ثم أي سبب فشل آخر (اختبارات، مهام جريدل).
            grep -E "^(e: |.*\.java:[0-9]+: error:)" /tmp/build.log | head -20 | while read -r line; do
              echo "::error::$line"
            done
            grep -E "(FAILED|What went wrong|Execution failed|Caused by:|Test.*FAILED|> [A-Za-z].*Exception)" /tmp/build.log \
              | grep -v "^::" | head -25 | while read -r line; do
              echo "::error::$line"
            done
            tail -40 /tmp/build.log | while read -r line; do echo "::notice::$line"; done
          fi
          exit $code

      - name: Read app version
        id: version
        run: |
          echo "name=$(grep -oP "versionName '\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -oP 'versionCode \K\d+' app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: github.ref == 'refs/heads/arena/01a07882-alameer-station'
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Configure KEYSTORE_BASE64 with the existing production signing key before releasing. Do not generate a replacement key."
            exit 1
          fi

      - name: Build signed release APK
        if: github.ref == 'refs/heads/arena/01a07882-alameer-station'
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
        run: |
          for required in KEYSTORE_FILE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!required}" ]; then echo "::error::Missing release signing secret: $required"; exit 1; fi
          done
          # التطبيق يقرأ التحديث من المستودع العام للنسخ إن ضُبط.
          if [ -n "${{ secrets.UPDATE_MANIFEST_URL }}" ]; then
            export UPDATE_MANIFEST_URL="${{ secrets.UPDATE_MANIFEST_URL }}"
          elif [ -n "$RELEASES_REPO" ]; then
            export UPDATE_MANIFEST_URL="https://github.com/$RELEASES_REPO/releases/latest/download/update-manifest.json"
          fi
          echo "Update URL: ${UPDATE_MANIFEST_URL:-<default>}"
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk \
             "Tabiq-v${{ steps.version.outputs.name }}.apk"

      - name: Verify the APK is signed
        if: github.ref == 'refs/heads/arena/01a07882-alameer-station'
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "Tabiq-v${{ steps.version.outputs.name }}.apk" | tee certs.txt
          grep -q "SHA-256 digest" certs.txt

      - name: Generate update manifest
        if: github.ref == 'refs/heads/arena/01a07882-alameer-station'
        run: |
          FILE="Tabiq-v${{ steps.version.outputs.name }}.apk"
          SIZE=$(stat -c%s "$FILE")
          HASH=$(sha256sum "$FILE" | cut -d" " -f1)
          HOST_REPO="${{ vars.RELEASES_REPO }}"
          if [ -z "$HOST_REPO" ]; then HOST_REPO="${{ github.repository }}"; fi
          BASE="https://github.com/$HOST_REPO/releases/download/v${{ steps.version.outputs.name }}"
          cat > update-manifest.json <<JSON
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ steps.version.outputs.name }}",
            "apkUrl": "$BASE/$FILE",
            "sizeBytes": $SIZE,
            "sha256": "$HASH",
            "notes": "نسخة ${{ steps.version.outputs.name }} من تطبيق طابق ورحّل.",
            "required": false
          }
          JSON
          cat update-manifest.json

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/arena/01a07882-alameer-station'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          APK="Tabiq-v${{ steps.version.outputs.name }}.apk"

          # النشر في المستودع العام للنسخ إن ضُبط، حتى يعمل التحديث التلقائي
          # مع بقاء الشيفرة ومفتاح التوقيع في مستودع خاص.
          if [ -n "$RELEASES_REPO" ] && [ -n "$RELEASES_TOKEN" ]; then
            echo "Publishing to public releases repo: $RELEASES_REPO"
            GH_TOKEN="$RELEASES_TOKEN" gh release delete "$TAG" --repo "$RELEASES_REPO" --yes --cleanup-tag 2>/dev/null || true
            GH_TOKEN="$RELEASES_TOKEN" gh release create "$TAG" \
              --repo "$RELEASES_REPO" \
              --title "طابق ورحّل ${{ steps.version.outputs.name }}" \
              --notes "نسخة موقّعة تُثبَّت فوق السابقة دون فقدان البيانات." \
              "$APK" update-manifest.json
          fi

          # نسخة في المستودع نفسه للأرشفة الداخلية.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "طابق ورحّل ${{ steps.version.outputs.name }}" \
            --notes "نسخة موقّعة تُثبَّت فوق السابقة دون فقدان البيانات." \
            "$APK" update-manifest.json

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload installable APK
        if: github.ref == 'refs/heads/arena/01a07882-alameer-station'
        uses: actions/upload-artifact@v4
        with:
          name: Alameer-Station-Shifts-APK
          path: |
            Tabiq-v*.apk
            update-manifest.json
          if-no-files-found: error
          retention-days: 30


      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 30
