name: Build CarCounter APK

on:
  push:
    branches: [ main ]
    paths: [ 'carcounter/**', '.github/workflows/carcounter-build.yml' ]
  pull_request:
    paths: [ 'carcounter/**', '.github/workflows/carcounter-build.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    defaults:
      run:
        working-directory: carcounter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android packages (SDK is preinstalled on the runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK (model is downloaded automatically by the build)
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CarCounter-v1.0.0-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarCounter-APK
          path: carcounter/CarCounter-v1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 14
