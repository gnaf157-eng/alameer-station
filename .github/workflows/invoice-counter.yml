name: Build Invoice Counter APK

on:
  push:
    branches: [ main, 'arena/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon -p invoice-counter :app:assembleDebug
      - name: Rename APK
        run: cp invoice-counter/app/build/outputs/apk/debug/app-debug.apk Invoice-Counter-v1.0.0.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Invoice-Counter-APK
          path: Invoice-Counter-v1.0.0.apk
          if-no-files-found: error
          retention-days: 14
