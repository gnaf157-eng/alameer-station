name: Build Invoice Counter APK

on:
  push:
    branches: [ main, 'arena/**' ]
  workflow_dispatch:

jobs:
  build:
    # تجاهل الدورات الذاتية عندما يرفع الـ workflow نفسه الملفات
    if: "github.event.head_commit.message != 'chore(invoice-counter): publish build artifacts'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        continue-on-error: true
        run: gradle --no-daemon -p invoice-counter :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build-full.log
      - name: Publish artifacts (APK or failure log)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          mkdir -p invoice-counter/apk
          if [ -f invoice-counter/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp invoice-counter/app/build/outputs/apk/debug/app-debug.apk invoice-counter/apk/Invoice-Counter-v1.0.0.apk
            cp invoice-counter/app/build/outputs/apk/debug/app-debug.apk Invoice-Counter-v1.0.0.apk
            echo "BUILD_OK=1" >> "$GITHUB_ENV"
          else
            cp build-full.log invoice-counter/build-failure.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f invoice-counter/apk/Invoice-Counter-v1.0.0.apk ]; then
            git add -f invoice-counter/apk
          fi
          git add invoice-counter/build-failure.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "chore(invoice-counter): publish build artifacts"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:"$GITHUB_REF" 2>&1; then break; fi
              sleep 15
              git pull --rebase origin "$GITHUB_REF" || true
            done
          fi
      - name: Upload installable APK
        if: env.BUILD_OK == '1'
        uses: actions/upload-artifact@v4
        with:
          name: Invoice-Counter-APK
          path: Invoice-Counter-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
