import java.util.Properties

plugins { id 'com.android.application' }

def secrets = new Properties()
def secretsFile = rootProject.file('keystore.properties')
if (secretsFile.exists()) secretsFile.withInputStream { secrets.load(it) }

/** يقرأ القيمة من keystore.properties، ثم من متغيرات البيئة، وإلا يرجع فراغًا. */
ext.prop = { String name ->
    def value = secrets.getProperty(name) ?: System.getenv(name) ?: project.findProperty(name)
    value == null ? '' : value.toString()
}
/** مفتاح التوقيع الثابت المرافق للمشروع: يضمن أن كل نسخة تُثبَّت فوق سابقتها بلا فقدان بيانات. */
ext.bundledKeystore = rootProject.file('signing/release.p12')
ext.signingReady = ['KEYSTORE_FILE', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'].every { !prop(it).isEmpty() } || bundledKeystore.exists()

android {
    namespace 'com.alameer.station.shifts'
    compileSdk 35
    defaultConfig {
        applicationId 'com.alameer.station.shifts.v2'
        minSdk 26
        targetSdk 35
        versionCode 138
        versionName '2.55.1'
        buildConfigField 'String', 'UPDATE_MANIFEST_URL', "\"${prop('UPDATE_MANIFEST_URL') ?: 'https://github.com/gnaf157-eng/alameer-station/releases/latest/download/update-manifest.json'}\""
        buildConfigField 'String', 'SYNC_URL', "\"${prop('SYNC_URL')}\""
        buildConfigField 'String', 'SYNC_SECRET', "\"${prop('SYNC_SECRET')}\""
    }

    signingConfigs {
        release {
            // يُفعّل فقط عند وجود keystore.properties أو متغيرات بيئة التوقيع.
            if (!prop('KEYSTORE_FILE').isEmpty()) {
                storeFile file(prop('KEYSTORE_FILE'))
                storePassword prop('KEYSTORE_PASSWORD')
                keyAlias prop('KEY_ALIAS')
                keyPassword prop('KEY_PASSWORD')
            } else if (bundledKeystore.exists()) {
                storeFile bundledKeystore
                storeType 'PKCS12'
                storePassword 'tabiq2216'
                keyAlias 'tabiq'
                keyPassword 'tabiq2216'
            }
        }
    }

    buildTypes {
        release {
            if (signingReady) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
