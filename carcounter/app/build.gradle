plugins { id 'com.android.application' }

android {
    namespace 'com.abognaf.carcounter'
    compileSdk 35
    defaultConfig {
        applicationId 'com.abognaf.carcounter'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        // هواتف ARM فقط لتقليل حجم الـ APK
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // منع ضغط ملف النموذج داخل الـ APK
    androidResources { noCompress 'tflite' }
    packaging { resources { excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*'] } }
    aaptOptions { noCompress 'tflite' }
}

// تنزيل نموذج EfficientDet-Lite0 (Int8, ~4.5MB) مرة واحدة إلى مجلد assets
// ملف TFLite صالح يبدأ بالبايتات "TFL3" عند الإزاحة 4
def isValidModel(File f) {
    if (!f.exists() || f.length() < 1000000) return false
    byte[] h = new byte[8]
    f.withInputStream { it.read(h) }
    return new String(h, 4, 4, 'US-ASCII') == 'TFL3'
}
// نموذج SSD-MobileNet-v1 COCO (Quantized, 300x300, ~4MB) مع مرحلة ما بعد المعالجة المدمجة
// (يُخرج صناديق جاهزة: boxes[1,10,4] classes[1,10] scores[1,10] count[1])
def modelFile = file('src/main/assets/detect.tflite')
def modelZipUrl = 'https://storage.googleapis.com/download.tensorflow.org/models/tflite/coco_ssd_mobilenet_v1_1.0_quant_2018_06_29.zip'
tasks.register('downloadModel') {
    outputs.file(modelFile)
    onlyIf { !isValidModel(modelFile) }
    doLast {
        modelFile.parentFile.mkdirs()
        println "Downloading TFLite model zip -> ${modelFile}"
        File zip = new File(temporaryDir, 'model.zip')
        new URL(modelZipUrl).withInputStream { i -> zip.withOutputStream { o -> o << i } }
        def zf = new java.util.zip.ZipFile(zip)
        def entry = zf.entries().find { it.name.endsWith('detect.tflite') }
        if (entry == null) throw new GradleException("detect.tflite not found in zip")
        zf.getInputStream(entry).withStream { i -> modelFile.withOutputStream { o -> o << i } }
        zf.close()
        if (!isValidModel(modelFile)) throw new GradleException("Downloaded model is invalid: ${modelFile}")
        println "Model OK: ${modelFile.length()} bytes"
    }
}
tasks.configureEach { t -> if (t.name == 'preBuild') t.dependsOn('downloadModel') }

dependencies {
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // TensorFlow Lite Interpreter الأساسي (بدون Task Library لتجنب مشاكل المكتبات الأصلية)
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
}
