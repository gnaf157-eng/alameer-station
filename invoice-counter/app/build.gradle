plugins { id 'com.android.application' }

android {
    namespace 'com.alameer.invoicecounter'
    compileSdk 35
    defaultConfig {
        applicationId 'com.alameer.invoicecounter'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.0.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

configurations.all {
    resolutionStrategy {
        // توحيد إصدارات kotlin-stdlib لتجنب تعامل الفئات المكررة
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'
    }
}

dependencies {
    // التعرف على النصوص (يدعم العربية) — يعمل على الجهاز بعد تنزيل النموذج مرة واحدة
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    // واجهة تثبيت النماذج (ModuleInstallClient) لتنزيل نموذج القراءة آليًا
    implementation 'com.google.android.gms:play-services-base:18.10.1'
    // اختبارات الوحدة (تشغيل الشاشة الرئيسية آليًا أثناء البناء)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.6.1'
}
